name: ci

# Fonctionne tel quel sur GitHub Actions et sur Forgejo Actions (qui lit aussi .github/workflows).
# Se déclenche seulement quand le code, ses dépendances, l'image ou les tests changent : pas pour la documentation.
# Une mise à jour de dépendance (go.mod, go.sum) ou d'image (Dockerfile, Makefile) passe donc par ce contrôle.
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - Makefile
      - integration/**
      - .github/workflows/**
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - Makefile
      - integration/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # Le job tourne dans l'image Go épinglée (la même que le Makefile) : aucun accès Docker nécessaire.
    # GitHub : ubuntu-latest. Forgejo : définir la variable de dépôt CI_RUNNER (étiquette du runner, par exemple docker).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    container:
      image: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GORUN vide : les cibles du Makefile s'exécutent directement dans ce conteneur (voir le Makefile).
      # Format, vet, tests avec détecteur de courses, fuzzing court, govulncheck, staticcheck, gosec.
      - run: make GORUN= fmt vet test fuzz vuln lint sec
