name: e2e

# Contrôles qui exigent un démon Docker : lint et analyse de l'image, intégration contre un vrai step-ca,
# bout en bout avec Warpgate et une cible sshd, test de la démo avec un vrai client ssh. Mêmes déclencheurs que ci.yml (code et dépendances seulement).
#
# GitHub : tourne tel quel sur ubuntu-latest (Docker et accès aux registres inclus).
# Forgejo : il faut un runner en mode hôte avec Docker (le Makefile monte le dossier du dépôt dans des conteneurs,
# ce qui suppose que le chemin de travail du job existe sur l'hôte Docker). Le job est ignoré tant que la variable
# de dépôt DOCKER_RUNNER n'est pas définie (valeur : l'étiquette de ce runner). Non validé sur un vrai runner.
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - Makefile
      - integration/**
      - .github/workflows/**
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - Makefile
      - integration/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: ${{ github.server_url == 'https://github.com' || vars.DOCKER_RUNNER != '' }}
    runs-on: ${{ vars.DOCKER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make init-cache
      - run: make hadolint scan integration e2e
      # La démo (make demo) est démarrée sans intervention, puis testée avec le vrai client ssh du runner et une requête web.
      - run: make demo-test
      - name: Nettoyage
        if: ${{ always() }}
        run: docker volume rm warpgate-adapter-gocache || true
