name: e2e

# Contrôles qui exigent un démon Docker : lint et analyse de l'image, intégration contre un vrai step-ca,
# bout en bout avec Warpgate et une cible sshd. Mêmes déclencheurs que ci.yml (code et dépendances seulement).
#
# Prérequis : un runner en mode hôte avec Docker (le Makefile monte le dossier du dépôt dans des conteneurs,
# ce qui suppose que le chemin de travail du job existe sur l'hôte Docker), avec accès aux registres
# (docker.io, ghcr.io, gcr.io). Ce job est ignoré tant que la variable de dépôt DOCKER_RUNNER n'est pas
# définie (valeur : l'étiquette de ce runner). Non validé sur un vrai runner : à essayer d'abord à la main.
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - Makefile
      - integration/**
      - .forgejo/workflows/**
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Dockerfile
      - Makefile
      - integration/**
      - .forgejo/workflows/**
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: ${{ vars.DOCKER_RUNNER != '' }}
    runs-on: ${{ vars.DOCKER_RUNNER }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: make init-cache
      - run: make hadolint scan integration e2e
      - name: Nettoyage
        if: ${{ always() }}
        run: docker volume rm warpgate-adapter-gocache || true
